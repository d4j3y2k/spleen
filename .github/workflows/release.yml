name: Build a reviewable macOS release

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Preview needs no credentials; notarized requires the release environment secrets
        type: choice
        options: [preview, notarized]
        default: preview
      draft_tag:
        description: Optional new release tag (for example v0.1.0); blank uploads workflow artifacts only
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    env:
      SPLEEN_BUILD_ROOT: ${{ runner.temp }}/spleen-build
      SPLEEN_OUTPUT_DIR: ${{ runner.temp }}/spleen-app
      SPLEEN_DIST_DIR: ${{ runner.temp }}/spleen-dist
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain and architecture
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          python3 --version
      - name: Test local logic and installer
        shell: bash
        run: |
          swift test --disable-sandbox --scratch-path "$SPLEEN_BUILD_ROOT" --cache-path "$SPLEEN_BUILD_ROOT/swiftpm-cache"
          # Native UI acceptance is a separate pre-publication check.
          python3 scripts/test-install.py
      - name: Prepare signing for a notarized release
        if: inputs.distribution == 'notarized'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64" && test -n "$CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          test -n "$SIGN_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM"
          umask 077
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          xcrun notarytool store-credentials release-notary --keychain "$RUNNER_TEMP/release.keychain-db" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM" --password "$APPLE_PASSWORD"
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Package preview
        if: inputs.distribution == 'preview'
        env:
          SPLEEN_SIGN_IDENTITY: '-'
        run: ./scripts/package.sh --preview
      - name: Package notarized release
        if: inputs.distribution == 'notarized'
        env:
          SPLEEN_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          SPLEEN_NOTARY_KEYCHAIN: ${{ runner.temp }}/release.keychain-db
        run: ./scripts/package.sh --notarize release-notary
      - uses: actions/upload-artifact@v4
        with:
          name: Spleen-macos-arm64-${{ inputs.distribution }}
          path: ${{ env.SPLEEN_DIST_DIR }}/*
          if-no-files-found: error
      - name: Create a draft for human review
        if: inputs.draft_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.draft_tag }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SPLEEN_OUTPUT_DIR/Spleen.app/Contents/Info.plist")
          [[ "$RELEASE_TAG" == "v$VERSION" || "$RELEASE_TAG" == "v$VERSION-"* ]] || { echo 'Tag does not match bundle version' >&2; exit 1; }
          printf '%s\n' "Apple silicon build; tested by automation on macOS 26." "Distribution: $DISTRIBUTION." "Preview builds are not notarized and may be blocked after download." "Review the artifacts and installation on a separate Mac before publishing." > "$RUNNER_TEMP/release-notes.txt"
          EXTRA=()
          if [[ "$DISTRIBUTION" == preview ]]; then EXTRA+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$SPLEEN_DIST_DIR"/*.zip "$SPLEEN_DIST_DIR"/*.sha256 --draft "${EXTRA[@]}" --target "$GITHUB_SHA" --title "Spleen $VERSION ($DISTRIBUTION)" --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Remove temporary signing material
        if: always() && inputs.distribution == 'notarized'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
